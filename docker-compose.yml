
services:
  # ───────────────────────── MySQL ─────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ims-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ims_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Admin@123}
    ports:
      - "${MYSQL_EXPOSED_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-Admin@123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ims-network

  # ───────────────────────── Redis ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ims-redis
    restart: unless-stopped
    # For production, set REDIS_PASSWORD in .env and uncomment:
    # command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ims-network

  # ───────────────────────── Backend (Spring Boot) ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ims-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ims_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-Admin@123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-imsSecretKey2026XYZ!@#SuperSecretKeyForJWTSigningMustBe256BitsLong}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
      UPLOAD_DIR: /app/uploads/
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "${BACKEND_EXPOSED_PORT:-8080}:8080"
    networks:
      - ims-network

  # ───────────────────────── Frontend (React + nginx) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: ims-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_EXPOSED_PORT:-80}:80"
    networks:
      - ims-network

networks:
  ims-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
