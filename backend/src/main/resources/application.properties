spring.application.name=ims-backend
server.port=8080
server.servlet.context-path=/api

# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ims_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Admin@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.open-in-view=false

# ── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:imsSecretKey2026XYZ!@#SuperSecretKeyForJWTSigningMustBe256BitsLong}
# 8-hour session token (was 24h) — a shorter-lived token limits the blast
# radius of a leaked token, in line with typical enterprise session policy.
app.jwt.expiration=${JWT_EXPIRATION:28800000}

# ── Login security (brute-force / account-takeover protection) ───────────────
# Account is locked for LOCKOUT_MINUTES after MAX_FAILED_ATTEMPTS consecutive
# bad passwords, then auto-unlocks. Independent of this, RATE_LIMIT_* throttles
# login attempts per source IP regardless of which username is being tried.
app.security.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
app.security.lockout-duration-minutes=${LOCKOUT_MINUTES:15}
app.security.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:15}
app.security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:300}

# ── File upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads/}

# ── Demo data ────────────────────────────────────────────────────────────────
# Seeds admin/admin123 + user/user123 on first run. Set to false (env var
# SEED_DEMO_USERS=false) before any real/production deployment.
app.seed-demo-users=${SEED_DEMO_USERS:true}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.ims=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.accept-case-insensitive-enums=true
