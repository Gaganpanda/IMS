<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Item Management System - Track and manage defence items" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo-hexagon.png" />
    <title>Item Management System</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ims-theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <!-- Fonts (Space Grotesk / Inter / JetBrains Mono) are self-hosted and
         imported in main.jsx via @fontsource — no external font CDN, so
         typography works the same on a fully offline/air-gapped network. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
