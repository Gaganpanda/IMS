server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match Spring Boot's spring.servlet.multipart.max-request-size (10MB).
    # Nginx's own default is 1MB, which silently 413s item-image uploads
    # before they ever reach the backend — that was the "Something went
    # wrong" error on image upload/update.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets — long cache, filenames are content-hashed by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # REST API -> backend service (compose service name "backend")
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (SockJS/STOMP) -> backend service
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Uploaded item images served by the backend.
    # NOTE: Spring Boot runs under server.servlet.context-path=/api, so the
    # WebMvcConfigurer resource handler actually lives at /api/uploads/**,
    # not /uploads/**. This block previously proxied to the wrong path and
    # was never hit (getImageUrl() in the frontend already builds URLs as
    # /api/uploads/..., which matches the /api/ block above instead).
    # Kept here, corrected, in case anything ever links to /uploads/ directly.
    location /uploads/ {
        proxy_pass http://backend:8080/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # React Router — always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
